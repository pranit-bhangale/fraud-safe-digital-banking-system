spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: UserPool
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # JPA CONFIGURATION
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  # FLYWAY CONFIGURATION
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # RABBITMQ CONFIGURATION
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
  cloud:
    stream:
      default:
        content-type: application/json
      bindings:
        processEmail-out-0:
          destination: email.notifications
# JWT Token Configuration
security:
  accessToken:
    expiration: 900
  token:
    issuer: bank
    # Keys Configuration
  keys:
    privateKeyPath: ${PRIVATE_KEY_PATH:key/private_key.pem}
    publicKeyPath: ${PUBLIC_KEY_PATH:key/public_key.pem}
cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
    - HEAD
  allowed-headers:
    - Content-Type
    - X-API-Version
    - Accept
    - Origin
    - Access-Control-Request-Method
    - Access-Control-Request-Headers
  allow-credentials: true
# EUREKA SERVICE DISCOVERY
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
# ACTUATOR AND HEALTH CHECKS
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
      readinessstate:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
# APPLICATION INFORMATION
info:
  app:
    name: user-service
    description: User Management Service
    version: 1.0.0
# LOGGING CONFIGURATION
logging:
  file:
    name: ${LOG_PATH:logs/user-service.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.banking.user: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs/user-service.log}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
server:
  port: ${PORT:8081}
  shutdown: graceful