spring:
  application:
    name: fraud-detection
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      request-connect-timeout: 2000
      request-read-timeout: 5000
    function:
      definition: fraudDetection
    stream:
      default-binder: kafka
      bindings:
        fraudDetection-in-0:
          destination: ${TOPIC_PAYMENT_INITIATED:banking.payment.initiated.v1}
          group: fraud-service-group
          content-type: application/json
          consumer:
            concurrency: ${FRAUD_CONSUMER_CONCURRENCY:6}
            max-attempts: 1
        fraudDetection-out-0:
          destination: ${TOPIC_PAYMENT_FRAUD_ACK:banking.payment.fraud-ack.v1}
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:29092}
          auto-create-topics: ${KAFKA_AUTO_CREATE_TOPICS:false}   # topics come from kafka-init
          auto-add-partitions: false
          min-partition-count: ${KAFKA_TOPIC_PARTITIONS:6}
          replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
          configuration:
            security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
            metadata.max.age.ms: 60000
            reconnect.backoff.ms: 500
            reconnect.backoff.max.ms: 5000
        bindings:
          fraudDetection-in-0:
            consumer:
              start-offset: earliest
              reset-offsets: false
              auto-commit-offset: true
              configuration:
                max.poll.records: 50
                max.poll.interval.ms: 300000
                session.timeout.ms: 15000
                heartbeat.interval.ms: 3000
                partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
          fraudDetection-out-0:
            producer:
              sync: false
              configuration:
                acks: all
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5
                compression.type: lz4
                batch.size: 32768
                linger.ms: 5
                request.timeout.ms: 5000
                delivery.timeout.ms: 15000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      connect-timeout: 2000ms
      timeout: 500ms
      client-type: lettuce
      lettuce:
        shutdown-timeout: 200ms
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 8
          max-wait: 1000ms
          time-between-eviction-runs: 30s

  lifecycle:
    timeout-per-shutdown-phase: 30s

fraud:
  window-ms: 600000
  window-limit: 5
  lock-ttl-seconds: 60
  high-amount: 100000
  threshold: 60
  weights:
    sender-velocity: 40
    receiver-velocity: 40
    burst: 30
    high-amount: 30

