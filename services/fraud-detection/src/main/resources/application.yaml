management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    binders:
      enabled: true
    redis:
      enabled: true
    mail:
      enabled: false

info:
  app:
    name: fraud-detection
    description: "Fraud Management & Real-Time Decisioning Service"
    version: 1.0.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_PATH:logs/fraud-detection.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.banking.fraud: ${LOG_LEVEL:DEBUG}
    org.apache.kafka.clients: WARN
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs/fraud-detection.log}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false

server:
  port: ${PORT:8084}
  shutdown: graceful