# Server Configuration
server:
  port: ${PORT:8888}
spring:
  application:
    name: config-server
  # Configuration Server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/${GITHUB_REPOSITORY}
          default-label: main
          clone-on-start: true
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
# Server Information
info:
  app:
    name: config-server
    description: "Centralized Configuration Server"
    version: "1.0.0"
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH:logs/config.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.banking.config: ${LOG_LEVEL:DEBUG}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs/config.log}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false