<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="x-apple-disable-message-reformatting">
    <meta content="telephone=no, date=no, address=no, email=no" name="format-detection">
    <title th:text="${subject}">Welcome</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1a1a2e;">
<table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#f4f4f7;" width="100%">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;max-width:560px;background-color:#ffffff;border-radius:8px;border:1px solid #e2e8f0;"
                   width="560">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding:28px 32px 8px;">
                        <span style="font-size:18px;font-weight:700;color:#0f172a;" th:text="${organizationName}">Organization</span>
                    </td>
                </tr>

                <!-- Greeting -->
                <tr>
                    <td style="padding:16px 32px 8px;">
                        <h1 style="margin:0 0 12px;font-size:20px;font-weight:600;color:#1a1a2e;">
                            Welcome, <span th:text="${fullName}">User</span>
                        </h1>
                        <p style="margin:0;font-size:15px;line-height:1.6;color:#475569;">
                            Your account with <strong th:text="${organizationName}">Organization</strong> has been
                            created successfully.
                        </p>
                    </td>
                </tr>

                <!-- Account details -->
                <tr>
                    <td style="padding:20px 32px;">
                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;"
                               width="100%">
                            <tr>
                                <td style="padding:14px 20px 6px;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;">
                                    Username
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:0 20px 12px;font-size:15px;font-weight:500;color:#1a1a2e;"
                                    th:text="${username}">username
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:0 20px 6px;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;">
                                    Account created
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:0 20px 14px;font-size:15px;font-weight:500;color:#1a1a2e;"
                                    th:text="${createdAt}">November 17, 2026 at 3:20 PM IST
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CTA -->
                <tr>
                    <td align="center" style="padding:8px 32px 32px;">
                        <a rel="noopener noreferrer" style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:15px;font-weight:600;
                                  text-decoration:none;padding:14px 32px;border-radius:6px;" target="_blank"
                           th:href="${organizationUrl}">
                            Get started
                        </a>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center"
                        style="padding:20px 32px;background-color:#f8fafc;border-top:1px solid #e2e8f0;border-radius:0 0 8px 8px;">
                        <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">
                            This email was sent to <span th:text="${recipientEmail}">your email</span> because an
                            account was created with
                            <span th:text="${organizationName}">Organization</span>. Please do not reply.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
