spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # DATABASE CONFIGURATION
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NotificationPool
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # JPA CONFIGURATION
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  # FLYWAY CONFIGURATION
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    table: flyway_schema_history
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    out-of-order: false
  # RABBITMQ CONFIGURATION
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 10
  # SPRING CLOUD STREAM CONFIGURATION
  cloud:
    function:
      definition: processEmail
    stream:
      default:
        content-type: application/json
      bindings:
        processEmail-in-0:
          destination: email.notifications
          group: email-worker-group
          consumer:
            concurrency: 3
            max-attempts: 5
            back-off-initial-interval: 2000
            back-off-multiplier: 2.0
            back-off-max-interval: 30000
            retry-template-name: processEmailRetryTemplate
      # RABBITMQ BINDER CONFIGURATION
      rabbit:
        bindings:
          processEmail-in-0:
            consumer:
              prefetch: 10
              auto-bind-dlq: true
              republish-to-dlq: true
              requeue-rejected: false
              dead-letter-queue-name: email.notifications.dlq
              ttl: 300000
              dlq-ttl: 604800000
              dlq-max-length: 10000
  # SMTP MAIL CONFIGURATION
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # THYMELEAF CONFIGURATION
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true
# APPLICATION MAIL SENDER CONFIGURATION
mail:
  from:
    address: no-reply@banking.com
    name: Digital Banking Support
# EUREKA SERVICE DISCOVERY
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
# ACTUATOR AND HEALTH CHECKS
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
      readinessstate:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
# APPLICATION INFORMATION
info:
  app:
    name: notification-service
    description: Digital Banking Notification Management Service
    version: 1.0.0
# LOGGING CONFIGURATION
logging:
  file:
    name: ${LOG_PATH:logs/notification-service.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.banking.notification: ${LOG_LEVEL:INFO}
    org.springframework.amqp: WARN
    org.springframework.cloud.stream: INFO
    org.hibernate.SQL: WARN
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:logs/notification-service.log}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false

server:
  port: ${SERVER_PORT:8282}
  shutdown: graceful
