syntax = "proto3";

package banking.transaction;

option java_multiple_files = true;
option java_package = "com.banking.transaction.grpc";
option java_outer_classname = "TransactionProto";

import "google/protobuf/timestamp.proto";

service TransactionService {

  rpc GetUserTransactionHistory(
      TransactionHistoryRequest) returns (TransactionHistoryResponse);
}

message TransactionHistoryRequest {
  string user_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message TransactionHistory {
  string transaction_id = 1;
  string user_id = 2;
  string account_id = 3;
  string reference_no = 4;
  string type = 5;
  string amount = 6;
  string balance_after = 7;
  string description = 8;
  google.protobuf.Timestamp transaction_date = 9;
}

message TransactionHistoryResponse {
  repeated TransactionHistory transactions = 1;

  int32 page = 2;
  int32 size = 3;
  int64 total_elements = 4;
  int32 total_pages = 5;
  bool has_next = 6;
  bool has_previous = 7;
}
