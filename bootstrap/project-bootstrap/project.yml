---
# Final config for fraud-safe-digital-banking-system
# Location: <repo>/bootstrap/project.yml
# Compose and application.yml files stay where they already are in the repo;
# bootstrap only checks tools, writes .env, starts the stack and waits for health.

project_name: fraud-safe-digital-banking-system
env_name: dev
project_root: "{{ (playbook_dir ~ '/..') | realpath }}"   # = repo root (parent of bootstrap/)

features:
  scaffold: false      # nothing to copy: files already live in the repo
  git: false           # repo and .gitignore already exist

required_tools:
  - name: docker
    check: docker compose version
    hint: "Install Docker Desktop and enable WSL integration."

# Read automatically by docker compose from the repo root
env_files:
  - dest: "{{ project_root }}/.env"
    overwrite: false
    vars:
      REDIS_PASSWORD: postgres
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

docker_stacks:
  - name: messaging
    compose_file: "{{ project_root }}/docker-compose-messaging.yaml"
    project_dir: "{{ project_root }}"
    wait: false          # kafka-init is a one-shot container

setup_commands:
  - name: List Kafka topics
    cmd: docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
    retries: 6
    delay: 5
    show_output: true

health_checks:
  ports:
    - { name: Redis, port: 6379 }
    - { name: RabbitMQ AMQP, port: 5672 }
    - { name: Kafka (host listener), port: 29092 }
  http:
    - { name: RabbitMQ management, url: "http://127.0.0.1:15672", timeout: 90 }
    - { name: Kafka UI, url: "http://127.0.0.1:7575", timeout: 90 }
  containers:
    - { name: kafka, timeout: 120 }
    - { name: redis, timeout: 60 }
    - { name: rabbitmq, timeout: 90 }

endpoints:
  - "Kafka UI:            http://localhost:7575"
  - "RabbitMQ management: http://localhost:15672  (guest / guest)"
  - "Kafka for host apps: localhost:29092"
  - "Redis:               localhost:6379"
