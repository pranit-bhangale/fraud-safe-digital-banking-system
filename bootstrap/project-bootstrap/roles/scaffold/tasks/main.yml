---
- name: Create project root
  ansible.builtin.file:
    path: "{{ project_root }}"
    state: directory

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path if item is mapping else item }}"
    state: directory
    mode: "{{ item.mode | default(omit) if item is mapping else omit }}"
  loop: "{{ directories }}"
  loop_control:
    label: "{{ item.path if item is mapping else item }}"

- name: Copy static files (existing differing files are backed up)
  ansible.builtin.copy:
    src: "{{ item.src if item.src.startswith('/') else playbook_dir ~ '/' ~ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default(omit) }}"
    backup: "{{ item.backup | default(true) }}"
    force: "{{ item.overwrite | default(true) }}"
  loop: "{{ managed_files }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Render Jinja templates
  ansible.builtin.template:
    src: "{{ item.src if item.src.startswith('/') else playbook_dir ~ '/' ~ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default(omit) }}"
    backup: "{{ item.backup | default(true) }}"
    force: "{{ item.overwrite | default(true) }}"
  loop: "{{ rendered_files }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Create symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ symlinks }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Download files
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    checksum: "{{ item.checksum | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ downloads }}"
  loop_control:
    label: "{{ item.dest }}"
