---
- name: "Run {{ phase }} commands"
  ansible.builtin.shell:
    cmd: "{{ item.cmd }}"
    chdir: "{{ item.chdir | default(omit) }}"
    creates: "{{ item.creates | default(omit) }}"
    removes: "{{ item.removes | default(omit) }}"
    executable: /bin/bash
  environment: "{{ item.env | default({}) }}"
  loop: "{{ setup_commands }}"
  loop_control:
    label: "[{{ phase }}] {{ item.name }}"
  when:
    - (item.phase | default('post')) == phase
    - item.enabled | default(true)
  register: command_result
  retries: "{{ item.retries | default(0) }}"
  delay: "{{ item.delay | default(5) }}"
  until: command_result.rc == 0
  ignore_errors: "{{ item.ignore_errors | default(false) }}"

- name: Show command output where requested
  ansible.builtin.debug:
    msg: "{{ item.stdout_lines | default([]) + item.stderr_lines | default([]) }}"
  loop: "{{ command_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('') }}"
  when:
    - item.item is defined
    - item.skipped is not defined
    - item.item.show_output | default(false)
